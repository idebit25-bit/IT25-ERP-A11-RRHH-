<div class="register-page">
  <section class="register-box">
    <h2>Crear cuenta</h2>

    <p class="notice" *ngIf="datosFormulario">
      Al terminar volveras al formulario con tus datos cargados. Por seguridad del navegador, deberas adjuntar de nuevo tu CV y carta.
    </p>

    <form #registroForm="ngForm">
      <label>
        Nombre(s)
        <input
          type="text"
          placeholder="Ingrese su nombre"
          name="nombre"
          [(ngModel)]="nombre"
          required>
      </label>

      <label>
        Apellidos
        <input
          type="text"
          placeholder="Ingrese sus apellidos"
          name="apellido"
          [(ngModel)]="apellido"
          required>
      </label>

      <label>
        Correo electronico
        <input
          type="email"
          placeholder="Ingrese su correo"
          name="correo"
          [(ngModel)]="correo" personalField="correo" #correoControl="ngModel" autocomplete="email"
          [attr.aria-invalid]="(correoControl.touched || datosFormulario) && correoControl.invalid ? 'true' : null" aria-describedby="usuario-registro-correo-error" required>
        <small class="personal-error" id="usuario-registro-correo-error" role="alert" *ngIf="(correoControl.touched || datosFormulario) && correoControl.errors?.['personalData']">{{ correoControl.errors?.['personalData'] }}</small>
      </label>

      <label>
        Crear contraseña (obligatoria)
        <input
          type="password"
          placeholder="Escribe tu nueva contraseña"
          name="password"
          #passwordControl="ngModel"
          [(ngModel)]="password"
          minlength="6"
          autocomplete="new-password"
          aria-describedby="password-help password-error"
          [attr.aria-invalid]="passwordControl.touched && passwordControl.invalid ? 'true' : null"
          required>
        <small id="password-help" class="password-help">
          Si aún no tienes cuenta, crea una contraseña de al menos 6 caracteres. La usarás para iniciar sesión. Este campo no se completa con los datos de tu solicitud.
        </small>
        <small id="password-error" class="password-error" role="alert" *ngIf="passwordControl.touched && passwordControl.invalid">
          {{ passwordControl.errors?.['required'] ? 'Escribe una contraseña para crear tu cuenta.' : 'Tu contraseña debe tener al menos 6 caracteres.' }}
        </small>
      </label>

      <label>
        Telefono
        <input
          type="tel"
          placeholder="Ingrese su telefono"
          name="telefono"
          [(ngModel)]="telefono"
          required personalField="telefono" #telefonoControl="ngModel" [attr.aria-invalid]="(telefonoControl.touched || datosFormulario) && telefonoControl.invalid ? 'true' : null" aria-describedby="usuario-registro-telefono-error" inputmode="numeric" autocomplete="tel-national">
<small class="personal-error" id="usuario-registro-telefono-error" role="alert" *ngIf="(telefonoControl.touched || datosFormulario) && telefonoControl.errors?.['personalData']">{{ telefonoControl.errors?.['personalData'] }}</small>
      </label>

      <label>
        CURP
        <input
          type="text"
          placeholder="Ingrese su CURP"
          name="curp"
          [ngModel]="curp" (ngModelChange)="curp = $event.toUpperCase()"
          required personalField="curp" #curpControl="ngModel" [attr.aria-invalid]="(curpControl.touched || datosFormulario) && curpControl.invalid ? 'true' : null" aria-describedby="usuario-registro-curp-error">
<small class="personal-error" id="usuario-registro-curp-error" role="alert" *ngIf="(curpControl.touched || datosFormulario) && curpControl.errors?.['personalData']">{{ curpControl.errors?.['personalData'] }}</small>
      </label>

      <label class="wide-field">
        Direccion
        <input
          type="text"
          placeholder="Ingrese su direccion"
          name="direccion"
          [(ngModel)]="direccion"
          required>
      </label>

      <label class="wide-field">
        Fecha de nacimiento
        <input
          type="text"
          placeholder="Ejemplo: 1990-01-01"
          name="fecha_nacimiento"
          [(ngModel)]="fecha_nacimiento"
          required personalField="fecha_nacimiento" #fecha_nacimientoControl="ngModel" [attr.aria-invalid]="(fecha_nacimientoControl.touched || datosFormulario) && fecha_nacimientoControl.invalid ? 'true' : null" aria-describedby="usuario-registro-fecha_nacimiento-error">
<small class="personal-error" id="usuario-registro-fecha_nacimiento-error" role="alert" *ngIf="(fecha_nacimientoControl.touched || datosFormulario) && fecha_nacimientoControl.errors?.['personalData']">{{ fecha_nacimientoControl.errors?.['personalData'] }}</small>
      </label>

      <p class="error" *ngIf="error">{{ error }}</p>

      <button
        type="button"
        [disabled]="registroForm.invalid"
        (click)="crearCuenta()">
        Crear cuenta
      </button>
    </form>

    <a routerLink="/admin-login">Ya tengo cuenta</a>
  </section>
</div>
